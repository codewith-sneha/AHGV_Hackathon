<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    AHGV AI Learning Assistant — System Architecture
  </text>

  <!-- ─── STUDENT ZONE ─────────────────────────────────────────── -->
  <rect x="20" y="60" width="180" height="220" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">STUDENT (Browser)</text>

  <!-- Video Player -->
  <rect x="36" y="96" width="148" height="60" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="110" y="115" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">🎬 Video Player</text>
  <text x="110" y="130" text-anchor="middle" font-size="9" fill="#3b82f6">React + Vite</text>
  <text x="110" y="143" text-anchor="middle" font-size="9" fill="#3b82f6">Vercel Deploy</text>

  <!-- Chat Panel -->
  <rect x="36" y="168" width="148" height="60" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="110" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">💬 Chat Panel</text>
  <text x="110" y="202" text-anchor="middle" font-size="9" fill="#3b82f6">Citations [1][2]</text>
  <text x="110" y="216" text-anchor="middle" font-size="9" fill="#3b82f6">Seek to timestamp</text>

  <!-- Lecture Page -->
  <rect x="36" y="240" width="148" height="30" rx="6" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1"/>
  <text x="110" y="259" text-anchor="middle" font-size="9" fill="#1e40af">📄 LecturePage.jsx</text>

  <!-- ─── BACKEND ZONE ─────────────────────────────────────────── -->
  <rect x="250" y="60" width="200" height="300" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">FASTAPI BACKEND</text>
  <text x="350" y="97" text-anchor="middle" font-size="9" fill="#16a34a">Render.com</text>

  <!-- POST /api/query -->
  <rect x="266" y="108" width="168" height="54" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="350" y="125" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">POST /api/query</text>
  <text x="350" y="139" text-anchor="middle" font-size="9" fill="#16a34a">Temporal guard</text>
  <text x="350" y="151" text-anchor="middle" font-size="9" fill="#16a34a">end_time ≤ pause_time</text>

  <!-- LearningAgent -->
  <rect x="266" y="174" width="168" height="54" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="350" y="191" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">LearningAgent</text>
  <text x="350" y="205" text-anchor="middle" font-size="9" fill="#16a34a">Intent detection</text>
  <text x="350" y="218" text-anchor="middle" font-size="9" fill="#16a34a">RAG orchestration</text>

  <!-- POST /api/ingest -->
  <rect x="266" y="240" width="168" height="54" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="350" y="257" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">POST /api/ingest</text>
  <text x="350" y="271" text-anchor="middle" font-size="9" fill="#16a34a">Whisper → transcript</text>
  <text x="350" y="284" text-anchor="middle" font-size="9" fill="#16a34a">PyMuPDF → PDF text</text>

  <!-- Embedder -->
  <rect x="266" y="306" width="168" height="40" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="350" y="322" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Embedder</text>
  <text x="350" y="337" text-anchor="middle" font-size="9" fill="#16a34a">all-MiniLM-L6-v2</text>

  <!-- ─── QDRANT ──────────────────────────────────────────────── -->
  <rect x="510" y="60" width="180" height="140" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">QDRANT</text>
  <text x="600" y="97" text-anchor="middle" font-size="9" fill="#9333ea">Vector Database</text>

  <rect x="526" y="108" width="148" height="40" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="600" y="124" text-anchor="middle" font-size="9" font-weight="600" fill="#7c3aed">knowledge_base</text>
  <text x="600" y="138" text-anchor="middle" font-size="9" fill="#8b5cf6">payload: source, kind</text>

  <rect x="526" y="158" width="148" height="30" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="600" y="172" text-anchor="middle" font-size="9" fill="#7c3aed">start / end / page / slide</text>
  <text x="600" y="182" text-anchor="middle" font-size="9" fill="#7c3aed">Filtered by end_time ≤ T</text>

  <!-- ─── GEMINI ──────────────────────────────────────────────── -->
  <rect x="510" y="220" width="180" height="100" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">GEMINI API</text>
  <rect x="526" y="254" width="148" height="50" rx="6" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
  <text x="600" y="270" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">gemini-2.5-flash</text>
  <text x="600" y="284" text-anchor="middle" font-size="9" fill="#ea580c">System: cite-only CONTEXT</text>
  <text x="600" y="298" text-anchor="middle" font-size="9" fill="#ea580c">Returns NOT_FOUND → refuse</text>

  <!-- ─── INGEST TOOLS ───────────────────────────────────────── -->
  <rect x="510" y="340" width="180" height="130" rx="12" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">INGEST TOOLS</text>

  <rect x="526" y="374" width="64" height="36" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="558" y="390" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">Whisper</text>
  <text x="558" y="403" text-anchor="middle" font-size="9" fill="#a16207">Transcript</text>

  <rect x="598" y="374" width="76" height="36" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="636" y="390" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">PyMuPDF</text>
  <text x="636" y="403" text-anchor="middle" font-size="9" fill="#a16207">PDF → chunks</text>

  <rect x="526" y="420" width="148" height="36" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="600" y="436" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">sentence-transformers</text>
  <text x="600" y="450" text-anchor="middle" font-size="9" fill="#a16207">embed → Qdrant upsert</text>

  <!-- ─── ARROWS ─────────────────────────────────────────────── -->

  <!-- Student → Backend (query) -->
  <line x1="200" y1="148" x2="248" y2="148" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="224" y="143" text-anchor="middle" font-size="8" fill="#6b7280">POST</text>
  <text x="224" y="153" text-anchor="middle" font-size="8" fill="#6b7280">/api/query</text>

  <!-- Backend → Qdrant (search) -->
  <line x1="452" y1="138" x2="508" y2="115" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="122" text-anchor="middle" font-size="8" fill="#6b7280">vector search</text>

  <!-- Backend → Gemini -->
  <line x1="452" y1="210" x2="508" y2="265" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="248" text-anchor="middle" font-size="8" fill="#6b7280">prompt +</text>
  <text x="490" y="258" text-anchor="middle" font-size="8" fill="#6b7280">context</text>

  <!-- Backend ingest → Ingest tools -->
  <line x1="452" y1="280" x2="508" y2="390" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="497" y="345" text-anchor="middle" font-size="8" fill="#6b7280">ingest</text>

  <!-- Qdrant ↔ Backend answer arrow back (dashed) -->
  <line x1="508" y1="130" x2="452" y2="168" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="472" y="158" text-anchor="middle" font-size="8" fill="#7c3aed">chunks</text>

  <!-- Gemini → Backend answer -->
  <line x1="508" y1="275" x2="452" y2="215" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="468" y="240" text-anchor="middle" font-size="8" fill="#c2410c">answer</text>

  <!-- Backend → Student (response) -->
  <line x1="248" y1="190" x2="200" y2="195" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="224" y="203" text-anchor="middle" font-size="8" fill="#6b7280">answer +</text>
  <text x="224" y="213" text-anchor="middle" font-size="8" fill="#6b7280">citations</text>

  <!-- Ingest tools → Qdrant -->
  <line x1="598" y1="406" x2="600" y2="332" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- ─── LEGEND ──────────────────────────────────────────────── -->
  <rect x="20" y="480" width="860" height="60" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="500" font-size="10" font-weight="700" fill="#475569">KEY SAFEGUARD</text>
  <text x="40" y="516" font-size="10" fill="#64748b">Timestamp Guard: retrieved chunks must satisfy</text>
  <text x="40" y="530" font-size="10" font-weight="600" fill="#7e22ce">chunk.end_time ≤ student's current video position (pause_time)</text>

  <line x1="440" y1="506" x2="460" y2="506" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="468" y="510" font-size="10" fill="#64748b">request / response</text>
  <line x1="440" y1="522" x2="460" y2="522" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="468" y="526" font-size="10" fill="#64748b">data returned</text>

  <text x="630" y="500" font-size="10" font-weight="700" fill="#475569">REFUSAL CASES</text>
  <text x="630" y="516" font-size="10" fill="#64748b">• Future content → "not covered yet"</text>
  <text x="630" y="530" font-size="10" fill="#64748b">• Off-topic → "not in resources"</text>
</svg>
